info:
  contact:
    email: support@rescuebyte.com
    name: RescueByte Support
  description: RESTful API documentation for RescueByte Backend.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: RescueByte Backend API
  version: "1.0"
paths:
  /api/v1/auth/google:
    get:
      description: Retrieve Google OAuth2 consent URL and CSRF state token
      produces:
      - application/json
      responses:
        "200":
          description: Google OAuth URL generated
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_pkg_helpers_http_response.Response'
            - properties:
                payload:
                  $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_domain_dto.GoogleAuthURLResponse'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_pkg_helpers_http_response.ErrorResponse'
      summary: Get Google OAuth2 URL
      tags:
      - Auth
  /api/v1/auth/google/callback:
    get:
      description: Authenticate or register a user through Google OAuth2 callback
        query parameters
      parameters:
      - description: OAuth Authorization Code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth State
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Authentication successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_pkg_helpers_http_response.Response'
            - properties:
                payload:
                  $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_domain_dto.AuthResponse'
              type: object
        "400":
          description: Bad request or state mismatch
          schema:
            $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_pkg_helpers_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_pkg_helpers_http_response.ErrorResponse'
      summary: Handle Google OAuth2 callback
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials and return JWT tokens
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rescuebyte_rescuebyte-be_domain_dto.LoginRequest'
